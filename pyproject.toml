[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-first-four-cells"
version = "0.1.0"
description = "Landmark forecasts of observed blastocyst timing"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "Pillow>=10", "threadpoolctl>=3"]

[project.scripts]
four-cells = "first_four_cells.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
first_four_cells = ["explorer.html"]

[project.optional-dependencies]
vision = ["torch>=2.2", "torchvision>=0.17"]
